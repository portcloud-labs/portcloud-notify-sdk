name: Publish

# Publishes the Python SDK to PyPI with Trusted Publishing (OIDC): no API token is
# stored in this repository. Configure the matching publisher on PyPI first — see
# the "Releasing" section of README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required by PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest -q

      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build --outdir dist python
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
