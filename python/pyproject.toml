[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portcloud-notify"
description = "Python SDK for the Portcloud Notify public HTTP API (email and ntfy notifications)."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
license = "WTFPL"
keywords = ["portcloud", "notify", "notifications", "email", "ntfy", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.version]
path = "src/portcloud_notify/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/portcloud_notify"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# UP045: `X | None` annotations are only evaluable at runtime on 3.10+, and this
# package supports 3.9, so `Optional[X]` stays.
ignore = ["E501", "UP045", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# N815: BaseHTTPRequestHandler dispatches on the literal method names do_GET/do_POST.
"tests/**" = ["N815"]
